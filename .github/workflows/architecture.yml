name: Architecture documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check diagrams and links
        run: node scripts/check-architecture.mjs
      - name: Check reviewer standards snapshot
        run: node scripts/check-reviewer-standards.mjs
